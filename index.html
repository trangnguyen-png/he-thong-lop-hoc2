<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay May Mắn</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: #16213e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 320px;
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #0f3460;
            background: #0f3460;
            color: #fff;
        }

        button {
            width: 95%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            background: #e94560;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: #ff6b81; }

        /* Vòng quay CSS */
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ff0000;
            z-index: 10;
        }

        canvas {
            border-radius: 50%;
            border: 5px solid #fff;
            transition: transform 4s cubic-bezier(0.15, 0.99, 0.18, 1);
        }

        /* Khung thông báo Ban */
        .ban-box {
            background: #4a0e17;
            border: 2px solid #ff4d4d;
            color: #ffcccc;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- KHU VỰC ĐĂNG NHẬP -->
    <div id="login-section" class="card">
        <h2>Đăng Nhập</h2>
        <input type="text" id="username" placeholder="Tên tài khoản">
        <input type="password" id="password" placeholder="Mật khẩu">
        <button onclick="login()">Đăng Nhập</button>
        
        <!-- Khung hiển thị thông báo nếu tài khoản bị Ban -->
        <div id="ban-message" class="ban-box">
            <h3 style="margin-top: 0;">TÀI KHOẢN BỊ KHÓA!</h3>
            <p id="ban-reason-text"></p>
        </div>
    </div>

    <!-- KHU VỰC VÒNG QUAY (Sau khi đăng nhập) -->
    <div id="game-section" class="card hidden">
        <h2>Xin chào, <span id="user-display"></span>!</h2>
        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheel" width="300" height="300"></canvas>
        </div>
        <button id="spin-btn" onclick="spinWheel()">QUAY NGAY</button>
        <p id="result-text" style="font-weight: bold; color: #4eef90;"></p>
        <button onclick="logout()" style="background: #555;">Đăng xuất</button>
    </div>

    <!-- KHU VỰC QUẢN LÝ BAN TÀI KHOẢN (Demo) -->
    <div class="card" style="border: 1px dashed #ff4d4d;">
        <h4 style="margin: 5px 0;">Bảng Điều Khiển (Ban Tài Khoản)</h4>
        <input type="text" id="ban-target" placeholder="Tên TK muốn Ban">
        <input type="text" id="ban-reason" placeholder="Lý do Ban">
        <button onclick="banUser()" style="background: #d9534f;">Xác Nhận Ban</button>
    </div>

    <script>
        // Danh sách các phần thưởng hiển thị chữ trên vòng quay
        const prizes = ["10K VNĐ", "Mất Lượt", "50K VNĐ", "Chúc May Mắn", "100K VNĐ", "Thêm Lượt"];
        const colors = ["#f39c12", "#e74c3c", "#9b59b6", "#3498db", "#2ecc71", "#1abc9c"];

        // Cơ sở dữ liệu tài khoản giả lập (Tài khoản vẫn tồn tại dù bị Ban)
        let usersDB = {
            "user1": { password: "123", isBanned: false, banReason: "" },
            "user2": { password: "123", isBanned: true, banReason: "Sử dụng phần mềm gian lận vòng quay." }
        };

        let currentUser = null;
        let isSpinning = false;
        let currentRotation = 0;

        // --- HÀM ĐĂNG NHẬP (ĐÃ XÓA TÀI KHOẢN ADMIN) ---
        function login() {
            const userIn = document.getElementById("username").value.trim();
            const passIn = document.getElementById("password").value.trim();
            const banBox = document.getElementById("ban-message");

            banBox.style.display = "none";

            // Chặn hoàn toàn tất cả các dạng tài khoản admin
            if (userIn.toLowerCase().includes("admin")) {
                alert("Lỗi: Tài khoản admin đã bị xóa hoàn toàn khỏi hệ thống!");
                return;
            }

            if (usersDB[userIn] && usersDB[userIn].password === passIn) {
                // Kiểm tra xem tài khoản có bị Ban hay không
                if (usersDB[userIn].isBanned) {
                    document.getElementById("ban-reason-text").innerText = "Lý do: " + usersDB[userIn].banReason;
                    banBox.style.display = "block"; // Hiển thị thông báo Ban cho người dùng thấy
                    return;
                }

                // Nếu không bị Ban -> Đăng nhập thành công
                currentUser = userIn;
                document.getElementById("user-display").innerText = currentUser;
                document.getElementById("login-section").classList.add("hidden");
                document.getElementById("game-section").classList.remove("hidden");
                drawWheel();
            } else {
                alert("Tên đăng nhập hoặc mật khẩu không đúng!");
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById("login-section").classList.remove("hidden");
            document.getElementById("game-section").classList.add("hidden");
            document.getElementById("username").value = "";
            document.getElementById("password").value = "";
        }

        // --- HÀM BAN TÀI KHOẢN (GIỮ TÀI KHOẢN, CHỈ KHÓA VÀ LƯU LÝ DO) ---
        function banUser() {
            const target = document.getElementById("ban-target").value.trim();
            const reason = document.getElementById("ban-reason").value.trim();

            if (!target || !reason) {
                alert("Vui lòng nhập đầy đủ tên tài khoản và lý do Ban!");
                return;
            }

            if (usersDB[target]) {
                usersDB[target].isBanned = true;
                usersDB[target].banReason = reason;
                alert(`Đã Ban tài khoản "${target}". Tài khoản vẫn lưu trên hệ thống nhưng người dùng sẽ thấy lý do Ban khi đăng nhập.`);
                document.getElementById("ban-target").value = "";
                document.getElementById("ban-reason").value = "";
            } else {
                alert("Không tìm thấy tài khoản này trong hệ thống!");
            }
        }

        // --- VẼ VÒNG QUAY VỚI CHỮ ---
        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const numPrizes = prizes.length;
        const arcSize = (2 * Math.PI) / numPrizes;

        function drawWheel() {
            for (let i = 0; i < numPrizes; i++) {
                const angle = i * arcSize;
                
                // Vẽ ô màu
                ctx.beginPath();
                ctx.fillStyle = colors[i];
                ctx.moveTo(150, 150);
                ctx.arc(150, 150, 150, angle, angle + arcSize);
                ctx.lineTo(150, 150);
                ctx.fill();

                // Vẽ chữ trên từng ô
                ctx.save();
                ctx.translate(150, 150);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                ctx.font = "bold 16px Arial";
                ctx.fillText(prizes[i], 130, 5);
                ctx.restore();
            }
        }

        // --- QUAY VÒNG QUAY ---
        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById("result-text").innerText = "";

            // Tính toán góc quay ngẫu nhiên (tối thiểu quay 5 vòng = 1800 độ)
            const randomDegree = Math.floor(Math.random() * 360) + 1800;
            currentRotation += randomDegree;

            canvas.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                
                // Tính toán phần thưởng trúng
                const actualDegrees = currentRotation % 360;
                // Góc 0 độ của canvas nằm ở bên phải (3 giờ), kim chỉ ở trên đỉnh (12 giờ = 270 độ)
                const symbolAngle = (360 - (actualDegrees % 360) + 270) % 360;
                const index = Math.floor(symbolAngle / (360 / numPrizes));
                
                document.getElementById("result-text").innerText = "Chúc mừng! Bạn quay vào: " + prizes[index];
            }, 4000);
        }
    </script>
</body>
</html>
